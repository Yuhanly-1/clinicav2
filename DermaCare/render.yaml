# Blueprint opcional de Render: crea la base de datos PostgreSQL y el servicio web.
# Render > New > Blueprint > seleccione este repositorio.
databases:
  - name: dermacare-db
    databaseName: dermacare
    plan: free

services:
  - type: web
    name: dermacare
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dermacare-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Santo_Domingo
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
